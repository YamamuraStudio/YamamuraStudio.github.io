<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yamamura Studio</title>
<meta name="description" content="Apps da Yamamura Studio: BrainGames, jogos educativos para crianças, e Fast Tools, PDF e mais.">
<link rel="icon" href="fasttools/img/icon.png">
<style>
:root{--bg:#f6f5f2;--ink:#22222a;--muted:#5d5b68;--card:#fff;--line:#e4e1da}
@media (prefers-color-scheme:dark){:root{--bg:#17171c;--ink:#f1efe9;--muted:#b3b0be;--card:#23232b;--line:#34343e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:62rem;margin:0 auto;padding:0 1rem}
header{display:flex;justify-content:flex-end;gap:.4rem;padding:1rem 0;flex-wrap:wrap}
header button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.35rem .9rem;font:inherit;font-size:.9rem;cursor:pointer}
header button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.15;margin:1rem 0 .5rem;text-align:center}
.lead{max-width:38rem;margin:0 auto 2rem;color:var(--muted);text-align:center;font-size:1.1rem}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.2rem}
.app{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:1.6rem;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.app:hover,.app:focus-visible{transform:translateY(-3px);border-color:var(--c)}
.app img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.app h2{margin:1rem 0 .2rem;font-size:1.5rem}
.app .tag{margin:0 0 .8rem;font-weight:600;color:var(--c)}
.app p{margin:0 0 1.2rem;color:var(--muted)}
.app p.tag{color:var(--c)}
.app .go{margin-top:auto;align-self:flex-start;background:var(--c);color:var(--cc);font-weight:700;padding:.65rem 1.4rem;border-radius:999px}
.bg{--c:#2e7d57;--cc:#fff}
.ft{--c:#8a6d00;--cc:#fff}
@media (prefers-color-scheme:dark){.bg{--c:#47c78c;--cc:#10241a}.ft{--c:#ffd60a;--cc:#1b1b1b}}
footer{text-align:center;color:var(--muted);font-size:.92rem;padding:3rem 0 2.5rem}
</style>
</head>
<body>
<div class="wrap">
<header role="group" aria-label="Language">
<button data-l="pt">Português</button><button data-l="en">English</button><button data-l="es">Español</button><button data-l="ja">日本語</button>
</header>
<h1>Yamamura Studio</h1>
<p class="lead" data-t="lead"></p>
<main class="apps">
<a class="app bg" href="braingames/">
<img src="braingames/img/icon.png" alt="BrainGames">
<h2>BrainGames</h2><p class="tag" data-t="bgTag"></p><p data-t="bgP"></p><span class="go" data-t="more"></span>
</a>
<a class="app ft" href="fasttools/">
<img src="fasttools/img/icon.png" alt="Fast Tools">
<h2>Fast Tools: PDF &amp; MORE</h2><p class="tag" data-t="ftTag"></p><p data-t="ftP"></p><span class="go" data-t="more"></span>
</a>
</main>
<footer><p>© Yamamura Studio</p></footer>
</div>
<script>
var T={
pt:{lead:"Escolha um app para conhecer.",bgTag:"Para crianças a partir de 3 anos",bgP:"Jogos educativos com o Professor Panda: letras, números, cores e formas, sem internet e sem cadastro.",ftTag:"PDF, documentos, boleto e Pix",ftP:"Leia PDF e Word, converta, una e separe PDFs, extraia texto e leia boletos e Pix. Tudo no seu aparelho.",more:"Conhecer o app"},
en:{lead:"Pick an app to find out more.",bgTag:"For kids ages 3 and up",bgP:"Educational games with Professor Panda: letters, numbers, colors and shapes, offline and with no sign-up.",ftTag:"PDF, documents, boletos and PIX",ftP:"Read PDF and Word, convert, merge and split PDFs, extract text and read boletos and PIX. All on your device.",more:"Learn more"},
es:{lead:"Elige una app para conocerla.",bgTag:"Para niños desde los 3 años",bgP:"Juegos educativos con el Profesor Panda: letras, números, colores y formas, sin internet y sin registro.",ftTag:"PDF, documentos, boleto y PIX",ftP:"Lee PDF y Word, convierte, une y separa PDFs, extrae texto y lee boletos y PIX. Todo en tu dispositivo.",more:"Conocer la app"},
ja:{lead:"アプリを選んでください。",bgTag:"3歳からのお子さま向け",bgP:"パンダせんせいと学ぶ知育ゲーム。文字・数字・色・形を、オフラインで登録なしで楽しめます。",ftTag:"PDF・書類・ブラジルの請求書とPIX",ftP:"PDFとWordの閲覧、変換、結合、分割、テキスト抽出。すべて端末内で処理します。",more:"くわしく見る"}
};
var tags={pt:"pt-BR",en:"en",es:"es",ja:"ja"};
function pick(){var s="";try{s=localStorage.getItem("l")||""}catch(e){}
if(T[s])return s;var n=(navigator.language||"en").slice(0,2);return T[n]?n:"en"}
function set(l){try{localStorage.setItem("l",l)}catch(e){}
document.documentElement.lang=tags[l];
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[l][e.dataset.t]});
document.querySelectorAll("header button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===l)})}
document.querySelectorAll("header button").forEach(function(b){b.onclick=function(){set(b.dataset.l)}});
set(pick());
</script>
</body>
</html>
